<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anjos de Resgate Catálogo de Adoção</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdn-uicons.flaticon.com/2.6.0/uicons-regular-rounded/css/uicons-regular-rounded.css">
    <link rel="stylesheet" href="https://cdn-uicons.flaticon.com/2.6.0/uicons-regular-rounded/css/uicons-regular-rounded.css">
    <link rel="stylesheet" href="https://cdn-uicons.flaticon.com/2.6.0/uicons-regular-rounded/css/uicons-regular-rounded.css">
</head>
<body>

    <header>

        <nav>
            <a href="#catalogo">
                <img src="logo.jpeg" alt="Logo Anjos de Resgate">
            </a>
        </nav>

        <form action="">
            <input type="search" placeholder="Procure pelo nome">
            <button type="submit" aria-label="Buscar">
                <i class="fi fi-rr-search" aria-hidden="true"></i>
            </button>
        </form>
        <p>Catálogo de Adoção</p>
    </header>

    <main class="titulo-catalogo">

        <section>
            <h1>Encontre seu Anjo <sup>3</sup></h1>
            <p>Explore o catálogo da ONG e personalize sua busca por porte, espécie ou idade.</p>
            <button type="button">
                Do seu jeitinho
                <i class="fi fi-rr-settings-sliders" aria-hidden="true"></i>
            </button>
        </section>

      <article>
                <img src="img/Max.jpg" alt="Foto do cão Max">
                <h2>MAX</h2>
                <ul>
                    <li><i class="fi fi-rr-dog" aria-hidden="true"></i> Cão</li>
                    <li><i class="fi fi-rr-mars" aria-hidden="true"></i> Macho</li>
                    <li><i class="fi fi-rr-ruler-horizontal" aria-hidden="true"></i> Médio</li>
                    <li><i class="fi fi-rr-calendar" aria-hidden="true"></i> Adulto</li>
                </ul>
                <a href="#detalhes-max">Ver perfil</a>
        </article>
        <article>
                <img src="img/Luna.jpg" alt="Foto da gata Luna">
                <h2>LUNA</h2>
                <ul>
                    <li><i class="fi fi-rr-cat" aria-hidden="true"></i> Gato</li>
                    <li><i class="fi fi-rr-venus" aria-hidden="true"></i> Fêmea</li>
                    <li><i class="fi fi-rr-ruler-horizontal" aria-hidden="true"></i> Pequeno</li>
                    <li><i class="fi fi-rr-calendar" aria-hidden="true"></i> Filhote</li>
                </ul>
                <a href="#detalhes-luna">Ver perfil</a>
        </article>
        <article>
                <img src="img/Duque.jpg" alt="Foto do cão Max">
                <h2>DUQUE</h2>
                <ul>
                    <li><i class="fi fi-rr-dog" aria-hidden="true"></i> Cão</li>
                    <li><i class="fi fi-rr-mars" aria-hidden="true"></i> Macho</li>
                    <li><i class="fi fi-rr-ruler-horizontal" aria-hidden="true"></i> Médio</li>
                    <li><i class="fi fi-rr-calendar" aria-hidden="true"></i> Idoso</li>
                </ul>
                <a href="#detalhes-max">Ver perfil</a>
        </article>

        
    </main>
</body>
</html>
